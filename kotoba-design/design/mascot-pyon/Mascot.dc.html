<script type="text/x-dc" data-dc-script data-props='{"mood":{"editor":"enum","options":["default","happy","think","sleepy","oops","celebrate"],"default":"default"},"size":{"editor":"int","min":48,"max":480,"default":240},"$preview":{"width":240,"height":240}}'>
class Component extends DCLogic {
  renderVals() {
    var mood = this.props.mood || 'default';
    var size = Number(this.props.size) || 240;
    var C = { e: [[84, 104], [116, 104]], m: [100, 119], s: 1.35, pl: [76, 146], pr: [124, 146] };
    var s = C.s;
    function ell(x, y, rx, ry) {
      return 'M' + (x - rx) + ' ' + y + ' a' + rx + ' ' + ry + ' 0 1 0 ' + (2 * rx) + ' 0 a' + rx + ' ' + ry + ' 0 1 0 ' + (-2 * rx) + ' 0 Z';
    }
    function star(x, y, r) {
      var k = r * 0.22;
      return 'M' + x + ' ' + (y - r) + ' Q' + (x + k) + ' ' + (y - k) + ' ' + (x + r) + ' ' + y +
        ' Q' + (x + k) + ' ' + (y + k) + ' ' + x + ' ' + (y + r) +
        ' Q' + (x - k) + ' ' + (y + k) + ' ' + (x - r) + ' ' + y +
        ' Q' + (x - k) + ' ' + (y - k) + ' ' + x + ' ' + (y - r) + ' Z';
    }
    function arcUp(x, y, w) { return 'M' + (x - w) + ' ' + (y + 2) + ' Q' + x + ' ' + (y - w - 1) + ' ' + (x + w) + ' ' + (y + 2); }
    function arcDown(x, y, w) { return 'M' + (x - w) + ' ' + y + ' Q' + x + ' ' + (y + 5) + ' ' + (x + w) + ' ' + y; }
    function eye(i) {
      var x = C.e[i][0], y = C.e[i][1], fill = '', stroke = '', hl = '', hx = x, hy = y;
      if (mood === 'happy') stroke = arcUp(x, y, 6 * s);
      else if (mood === 'sleepy') stroke = arcDown(x, y, 6 * s);
      else if (mood === 'celebrate') fill = star(x, y, 8 * s);
      else if (mood === 'think') { hx = x + 2; hy = y - 3; fill = ell(hx, hy, 4.5 * s, 5.5 * s); }
      else if (mood === 'oops') { hy = y + 1; fill = ell(x, hy, 4.5 * s, 5 * s); }
      else fill = ell(x, y, 5 * s, 6.5 * s);
      if (fill && mood !== 'celebrate') {
        hl = ell(hx - 1.8 * s, hy - 2.6 * s, 2 * s, 2 * s) + ' ' + ell(hx + 2 * s, hy + 2.6 * s, 0.9 * s, 0.9 * s);
      }
      return { fill: fill, stroke: stroke, hl: hl };
    }
    var mx = C.m[0], my = C.m[1], mouthS = '', mouthF = '', tongue = '';
    if (mood === 'happy' || mood === 'celebrate') {
      var w = mood === 'celebrate' ? 11 : 9, h = mood === 'celebrate' ? 16 : 12;
      mouthF = 'M' + (mx - w) + ' ' + my + ' Q' + mx + ' ' + (my + h) + ' ' + (mx + w) + ' ' + my + ' Z';
      tongue = ell(mx, my + h * 0.42, w * 0.42, h * 0.16);
    } else if (mood === 'think') {
      mouthF = ell(mx + 3, my + 1, 3.5, 3.5);
    } else if (mood === 'sleepy') {
      mouthF = ell(mx, my + 1, 2.5, 2.5);
    } else if (mood === 'oops') {
      mouthS = 'M' + (mx - 8) + ' ' + (my + 2) + ' q4 -4 8 0 t8 0';
    } else {
      mouthS = 'M' + (mx - 7) + ' ' + my + ' q3.5 4.5 7 0 q3.5 4.5 7 0';
    }
    /* right paw holds the flag, so it only tilts; the left arm does the gestures */
    var aL = 0, aR = 0;
    if (mood === 'happy') { aL = 60; aR = 8; }
    if (mood === 'celebrate') { aL = 75; aR = 14; }
    if (mood === 'think') aL = 35;
    if (mood === 'sleepy') { aL = -8; aR = 10; }
    if (mood === 'oops') aR = 4;
    var eL = eye(0), eR = eye(1);
    return {
      px: size + 'px',
      eLf: eL.fill, eLs: eL.stroke, eRf: eR.fill, eRs: eR.stroke,
      hlL: eL.hl, hlR: eR.hl,
      mouthS: mouthS, mouthF: mouthF, tongue: tongue,
      armL: 'rotate(' + aL + ' ' + C.pl[0] + ' ' + C.pl[1] + ')',
      armR: 'rotate(' + aR + ' ' + C.pr[0] + ' ' + C.pr[1] + ')',
      oZ: mood === 'sleepy' ? 1 : 0, oSweat: mood === 'oops' ? 1 : 0,
      oSpark: mood === 'celebrate' ? 1 : 0, oThink: mood === 'think' ? 1 : 0
    };
  }
}
</script>
