<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Biểu cảm — Usa</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/kotoba/tokens.css">
<link rel="stylesheet" href="ds/kotoba/components/bundle.css">
<script src="ds/kotoba/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;padding:0;background:transparent}
</style>
</helmet>
<div style="width: 1180px; height: 340px; box-sizing: border-box; padding: 28px 32px; background: var(--surface); color: var(--ink); font-family: var(--font-sans); display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 16px;">
  <sc-for list="{{moods}}" as="m" hint-placeholder-count="6">
    <div style="display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center;">
      <div style="width: 168px; height: 168px; border-radius: 50%; background: var(--surface-tint); display: flex; align-items: center; justify-content: center;">
        <dc-import name="Mascot" kind="{{kind}}" mood="{{m.mood}}" size="150" hint-size="150px,150px"></dc-import>
      </div>
      <b style="margin-top: 8px; font-size: 15px; line-height: 20px;">{{m.label}}</b>
      <span style="font-size: 13px; line-height: 18px; color: var(--ink-muted);">{{m.use}}</span>
    </div>
  </sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"kind":{"editor":"enum","options":["rabbit","tanuki","daruma"],"default":"rabbit"},"$preview":{"width":1180,"height":340}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      kind: this.props.kind || 'rabbit',
      moods: [
        { mood: 'default', label: 'Mặc định', use: 'Trang chủ, lời chào' },
        { mood: 'happy', label: 'Đúng rồi!', use: 'Trả lời đúng, vuốt "Đã nhớ"' },
        { mood: 'think', label: 'Đang nghĩ', use: 'AI đang trả lời, tải bài' },
        { mood: 'oops', label: 'Ôn lại nhé', use: 'Trả lời sai, vuốt "Ôn lại"' },
        { mood: 'sleepy', label: 'Ngủ gật', use: 'Lâu không học, danh sách trống' },
        { mood: 'celebrate', label: 'Ăn mừng', use: 'Đạt mục tiêu, giữ chuỗi' }
      ]
    };
  }
}
</script>
</body>
</html>
