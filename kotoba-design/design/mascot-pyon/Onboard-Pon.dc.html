<!doctype html>

<body>
<x-dc>
<helmet>
<style>
body{margin:0;padding:0;background:transparent}
a{color:var(--primary-ink)}a:hover{color:var(--ink)}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 24px 24px 32px; background: var(--bg); color: var(--ink); font-family: var(--font-sans); display: flex; flex-direction: column; overflow: hidden;">
  <div style="display: flex; justify-content: flex-end;">
    <a href="#" style="font-size: 14px; font-weight: 600; text-decoration: none; padding: 10px 4px;">Bỏ qua</a>
  </div>

  <div style="position: relative; height: 380px; display: flex; align-items: center; justify-content: center; margin-top: 8px;">
    <svg width="340" height="340" viewBox="0 0 340 340" aria-hidden="true" style="position: absolute; left: 1px; top: 20px;">
      <circle cx="170" cy="170" r="150" fill="#EEEBFF"></circle>
      <circle cx="170" cy="170" r="118" fill="#F6F3FF"></circle>
      <g transform="rotate(-30 58 84)"><path d="M58 98 C 48 90 50 76 62 70 C 68 80 66 92 58 98 Z" fill="#28D873"></path></g>
      <g transform="rotate(40 288 112)"><path d="M288 126 C 278 118 280 104 292 98 C 298 108 296 120 288 126 Z" fill="#28D873" opacity="0.7"></path></g>
      <g transform="rotate(-70 274 268)"><path d="M274 280 C 266 274 268 262 277 258 C 282 266 280 276 274 280 Z" fill="#28D873" opacity="0.5"></path></g>
      <path d="M52 250 a16 16 0 0 1 28 -8 a12 12 0 0 1 20 10 h-48 Z" fill="#FFFFFF"></path>
      <path d="M240 54 a14 14 0 0 1 24 -7 a10 10 0 0 1 17 9 h-41 Z" fill="#FFFFFF"></path>
    </svg>
    <div style="position: relative; margin-top: 30px;">
      <dc-import name="Mascot" kind="tanuki" mood="happy" size="270" hint-size="270px,270px"></dc-import>
    </div>
  </div>

  <div style="display: flex; flex-direction: column; align-items: center; gap: 12px; text-align: center; margin-top: 12px;">
    <h1 style="margin: 0; font-size: 30px; line-height: 36px; font-weight: 400; letter-spacing: -0.02em;">Chào bạn, mình là <b style="font-weight: 800; color: var(--primary-ink);">Pon!</b></h1>
    <p style="margin: 0; font-size: 15px; line-height: 22px; color: var(--ink-muted); max-width: 300px;">Tanuki đặt chiếc lá lên đầu là biến hình. Mỗi bài học là một chiếc lá — rồi bạn sẽ "biến hình" thành người nói tiếng Nhật.</p>
  </div>

  <div style="display: flex; justify-content: center; gap: 6px; margin-top: 24px;" aria-hidden="true">
    <span style="width: 22px; height: 6px; border-radius: 999px; background: var(--primary-strong);"></span>
    <span style="width: 6px; height: 6px; border-radius: 999px; background: var(--line-strong);"></span>
    <span style="width: 6px; height: 6px; border-radius: 999px; background: var(--line-strong);"></span>
  </div>

  <div style="margin-top: auto; display: flex; flex-direction: column; gap: 12px; align-items: center;">
    <button class="kt-swipe" type="button">
      <span class="kt-swipe__knob"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 17 5-5-5-5M13 17l5-5-5-5"></path></svg></span>
      Bắt đầu cùng Pon
    </button>
    <a href="#" style="font-size: 14px; font-weight: 600; text-decoration: none; padding: 10px;">Mình đã có tài khoản</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
