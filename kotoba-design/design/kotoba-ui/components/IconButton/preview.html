<!doctype html>
<html lang="vi">
<head><meta charset="utf-8"><title>IconButton — preview</title></head>
<body>
<div class="kt-row">
  <button class="kt-iconbtn" aria-label="Menu"><i data-icon="menu"></i></button>
  <button class="kt-iconbtn kt-iconbtn--surface has-dot" aria-label="Thông báo (có mới)"><i data-icon="bell"></i></button>
  <button class="kt-iconbtn kt-iconbtn--dark" aria-label="Nhắc lịch"><i data-icon="bell"></i></button>
  <button class="kt-iconbtn" aria-label="Quay lại"><i data-icon="chevron-left"></i></button>
  <button class="kt-iconbtn kt-iconbtn--surface kt-iconbtn--sm" aria-label="Mở"><i data-icon="arrow-up-right"></i></button>
  <button class="kt-iconbtn kt-iconbtn--xs" aria-label="Phát"><i data-icon="play"></i></button>
  <button class="kt-iconbtn kt-iconbtn--xs" aria-label="Tạm dừng"><i data-icon="pause"></i></button>
  <button class="kt-iconbtn kt-iconbtn--sm" aria-label="Phát âm"><i data-icon="volume"></i></button>
</div>
<script>window.Kotoba && Kotoba.hydrate();</script>
</body>
</html>
