<!doctype html>
<html lang="vi">
<head><meta charset="utf-8"><title>AIComposer — preview</title></head>
<body>
<div class="kt-composer" style="max-width:520px">
  <textarea rows="2" aria-label="Hỏi gia sư AI" placeholder="Giải thích bài ngữ pháp hôm nay bằng ví dụ đơn giản…"></textarea>
  <div class="kt-composer__bar">
    <button class="kt-tool" aria-label="Đính kèm"><i data-icon="plus"></i></button>
    <button class="kt-tool"><i data-icon="globe"></i>Tìm kiếm</button>
    <span class="kt-spacer"></span>
    <button class="kt-tool" aria-label="Biểu cảm"><i data-icon="smile"></i></button>
    <button class="kt-tool" aria-label="Nói"><i data-icon="mic"></i></button>
    <button class="kt-send" aria-label="Gửi"><i data-icon="arrow-up-right"></i></button>
  </div>
</div>
<script>window.Kotoba && Kotoba.hydrate();</script>
</body>
</html>
