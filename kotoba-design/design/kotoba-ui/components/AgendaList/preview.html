<!doctype html>
<html lang="vi">
<head><meta charset="utf-8"><title>AgendaList — preview</title></head>
<body>
<div class="kt-phone kt-agenda">
  <div class="kt-slot"><span class="kt-slot__time">08:00</span><div class="kt-slot__lane">
    <div class="kt-acard kt-acard--kanji"><span class="kt-acard__title">Kanji N5 · Bài 3</span><span class="kt-acard__time">08:00 – 08:45</span><button class="kt-iconbtn kt-iconbtn--xs" aria-label="Mở"><i data-icon="arrow-up-right"></i></button></div>
  </div></div>
  <div class="kt-slot"><span class="kt-slot__time">10:00</span><div class="kt-slot__lane" style="--indent:40px">
    <div class="kt-acard kt-acard--grammar"><span class="kt-acard__title">Ngữ pháp: て-form</span><span class="kt-acard__time">11:00 – 11:45</span><button class="kt-iconbtn kt-iconbtn--xs" aria-label="Mở"><i data-icon="arrow-up-right"></i></button></div>
  </div></div>
  <div class="kt-slot"><span class="kt-slot__time">12:00</span><div class="kt-slot__lane" style="border-top:0;padding-top:0">
    <div class="kt-gap">Không có lớp từ 12:00 đến 14:00</div>
  </div></div>
  <div class="kt-slot"><span class="kt-slot__time">14:00</span><div class="kt-slot__lane">
    <div class="kt-acard kt-acard--speaking"><span class="kt-acard__title">Luyện nghe hội thoại</span><span class="kt-acard__time">14:00 – 14:45</span><button class="kt-iconbtn kt-iconbtn--xs" aria-label="Mở"><i data-icon="arrow-up-right"></i></button></div>
  </div></div>
  <div class="kt-slot"><span class="kt-slot__time">16:00</span><div class="kt-slot__lane" style="--indent:40px">
    <div class="kt-acard kt-acard--vocab"><span class="kt-acard__title">Từ vựng: Mua sắm</span><span class="kt-acard__time">16:30 – 17:00</span><button class="kt-iconbtn kt-iconbtn--xs" aria-label="Mở"><i data-icon="arrow-up-right"></i></button></div>
  </div></div>
</div>
<script>window.Kotoba && Kotoba.hydrate();</script>
</body>
</html>
