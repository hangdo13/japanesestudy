<!doctype html>
<html lang="vi">
<head><meta charset="utf-8"><title>SwipeButton — preview</title></head>
<body>
<div class="kt-phone kt-stack" style="gap:var(--space-5);text-align:center;align-items:center">
  <span style="width:200px;height:200px;border-radius:50%;background:var(--surface-tint);display:flex;align-items:center;justify-content:center"><span class="kt-mascot" data-mascot="happy" data-size="180"></span></span>
  <h1 style="margin:0;font-size:30px;line-height:36px;font-weight:400;letter-spacing:-.02em">Chào bạn, mình là<br><b style="font-weight:800;color:var(--primary-ink)">Pyon!</b></h1>
  <p class="kt-muted" style="margin:0">Mỗi ngày một bước nhảy nhỏ — <span class="kt-jp" lang="ja">ぴょん</span> — là tiếng Nhật tiến lên.</p>
  <button class="kt-swipe"><span class="kt-swipe__knob"><i data-icon="chevrons-right"></i></span>Bắt đầu cùng Pyon</button>
</div>
<script>window.Kotoba && Kotoba.hydrate();</script>
</body>
</html>
