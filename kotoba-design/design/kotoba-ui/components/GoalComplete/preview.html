<!doctype html>
<html lang="vi">
<head><meta charset="utf-8"><title>GoalComplete — preview</title></head>
<body>
<section class="kt-phone kt-goal" aria-label="Hoàn thành mục tiêu tuần">
  <div class="kt-goal__stage">
    <span class="kt-goal__petal" style="left:18px;top:52px;transform:rotate(-30deg)" aria-hidden="true"></span>
    <span class="kt-goal__petal" style="right:26px;top:30px;transform:rotate(25deg)" aria-hidden="true"></span>
    <span class="kt-goal__petal" style="right:8px;bottom:70px;transform:rotate(70deg);opacity:.7" aria-hidden="true"></span>
    <span class="kt-goal__petal" style="left:36px;bottom:28px;transform:rotate(-60deg);opacity:.8" aria-hidden="true"></span>
    <span class="kt-mascot" data-mascot="celebrate" data-size="210"></span>
  </div>
  <h2 class="kt-goal__title">Xong mục tiêu tuần! <span class="kt-jp" lang="ja">ぴょん</span></h2>
  <p class="kt-goal__text">7 bước nhảy cùng Pyon — 7 ngày liên tiếp, 42 từ mới.</p>
  <div class="kt-goal__chips">
    <span class="kt-chip kt-chip--rank">+200 XP</span>
    <span class="kt-chip kt-chip--success">Chuỗi 7 ngày</span>
  </div>
  <button class="kt-btn kt-btn--primary kt-btn--block">Tiếp tục</button>
</section>
<script>window.Kotoba && Kotoba.hydrate();</script>
</body>
</html>
