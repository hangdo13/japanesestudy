<!-- @dsCard group="Linh vật" height=430 width=900 subtitle="Pyon — 6 biểu cảm, data-mascot + data-size" -->
<!doctype html>
<html lang="vi">
<head><meta charset="utf-8"><title>Mascot — preview</title></head>
<body>
<div class="kt-stack" style="gap:var(--space-6)">
  <div style="display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:var(--space-3)">
    <div class="kt-stack" style="align-items:center;gap:6px;text-align:center"><span style="width:132px;height:132px;border-radius:50%;background:var(--surface-tint);display:flex;align-items:center;justify-content:center"><span class="kt-mascot" data-mascot="default" data-size="118"></span></span><b style="font-size:14px">default</b><small class="kt-muted">Lời chào</small></div>
    <div class="kt-stack" style="align-items:center;gap:6px;text-align:center"><span style="width:132px;height:132px;border-radius:50%;background:var(--surface-tint);display:flex;align-items:center;justify-content:center"><span class="kt-mascot" data-mascot="happy" data-size="118"></span></span><b style="font-size:14px">happy</b><small class="kt-muted">Trả lời đúng</small></div>
    <div class="kt-stack" style="align-items:center;gap:6px;text-align:center"><span style="width:132px;height:132px;border-radius:50%;background:var(--surface-tint);display:flex;align-items:center;justify-content:center"><span class="kt-mascot" data-mascot="think" data-size="118"></span></span><b style="font-size:14px">think</b><small class="kt-muted">AI đang trả lời</small></div>
    <div class="kt-stack" style="align-items:center;gap:6px;text-align:center"><span style="width:132px;height:132px;border-radius:50%;background:var(--surface-tint);display:flex;align-items:center;justify-content:center"><span class="kt-mascot" data-mascot="oops" data-size="118"></span></span><b style="font-size:14px">oops</b><small class="kt-muted">Ôn lại</small></div>
    <div class="kt-stack" style="align-items:center;gap:6px;text-align:center"><span style="width:132px;height:132px;border-radius:50%;background:var(--surface-tint);display:flex;align-items:center;justify-content:center"><span class="kt-mascot" data-mascot="sleepy" data-size="118"></span></span><b style="font-size:14px">sleepy</b><small class="kt-muted">Màn trống, nhắc học</small></div>
    <div class="kt-stack" style="align-items:center;gap:6px;text-align:center"><span style="width:132px;height:132px;border-radius:50%;background:var(--sakura-soft);display:flex;align-items:center;justify-content:center"><span class="kt-mascot" data-mascot="celebrate" data-size="118"></span></span><b style="font-size:14px">celebrate</b><small class="kt-muted">Đạt mục tiêu</small></div>
  </div>
  <div class="kt-row" style="gap:var(--space-6);align-items:flex-end">
    <div class="kt-stack" style="align-items:center;gap:6px"><span class="kt-mascot" data-mascot="default" data-size="120"></span><small class="kt-muted">120px · đủ chi tiết</small></div>
    <div class="kt-stack" style="align-items:center;gap:6px"><span class="kt-mascot" data-mascot="default" data-size="80"></span><small class="kt-muted">80px</small></div>
    <div class="kt-stack" style="align-items:center;gap:6px"><span class="kt-mascot" data-mascot="default" data-size="56"></span><small class="kt-muted">56px · tự bỏ cờ &amp; hoa</small></div>
    <div class="kt-stack" style="align-items:center;gap:6px"><span class="kt-mascot" data-mascot="happy" data-size="120" data-flag="off"></span><small class="kt-muted">data-flag="off"</small></div>
  </div>
</div>
<script>window.Kotoba && Kotoba.hydrate();</script>
</body>
</html>
