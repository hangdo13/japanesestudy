<!doctype html>
<html lang="vi">
<head><meta charset="utf-8"><title>StatCard — preview</title></head>
<body>
<div class="kt-phone kt-grid-2">
  <article class="kt-card kt-stat">
    <div class="kt-stat__top"><span class="kt-stat__icon"><i data-icon="clock"></i></span><span class="kt-stat__value">1.5<small>giờ</small></span></div>
    <div class="kt-stat__bottom"><span class="kt-stat__label">Thời gian học tuần này</span><button class="kt-iconbtn kt-iconbtn--sm" aria-label="Xem chi tiết"><i data-icon="arrow-up-right"></i></button></div>
  </article>
  <article class="kt-card kt-stat">
    <div class="kt-stat__top"><span class="kt-stat__icon kt-stat__icon--blue"><i data-icon="note"></i></span><span class="kt-stat__value">10<small>bài</small></span></div>
    <div class="kt-stat__bottom"><span class="kt-stat__label">Bài đã hoàn thành</span><button class="kt-iconbtn kt-iconbtn--sm" aria-label="Xem chi tiết"><i data-icon="arrow-up-right"></i></button></div>
  </article>
</div>
<script>window.Kotoba && Kotoba.hydrate();</script>
</body>
</html>
