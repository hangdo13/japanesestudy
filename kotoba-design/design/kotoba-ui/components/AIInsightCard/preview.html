<!doctype html>
<html lang="vi">
<head><meta charset="utf-8"><title>AIInsightCard — preview</title></head>
<body>
<article class="kt-card kt-insight" style="max-width:420px">
  <div class="kt-sechead"><h2>Gợi ý từ AI</h2><span class="kt-chip kt-chip--ai"><i data-icon="sparkles"></i>Pyon gợi ý</span></div>
  <div class="kt-insight__mascot"><span class="kt-mascot" data-mascot="think" data-size="120"></span></div>
  <p class="kt-insight__text">Tuần này bạn hay nhầm <b class="kt-jp">は</b> và <b class="kt-jp">が</b>. Ôn 5 câu ví dụ trong 3 phút nhé?</p>
  <div class="kt-composer">
    <textarea rows="1" aria-label="Hỏi Pyon" placeholder="Hỏi Pyon thêm về は và が…"></textarea>
    <div class="kt-composer__bar"><button class="kt-tool" aria-label="Đính kèm"><i data-icon="plus"></i></button><span class="kt-spacer"></span><button class="kt-tool" aria-label="Nói"><i data-icon="mic"></i></button><button class="kt-send" aria-label="Gửi"><i data-icon="arrow-up-right"></i></button></div>
  </div>
</article>
<script>window.Kotoba && Kotoba.hydrate();</script>
</body>
</html>
