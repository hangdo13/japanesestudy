<!-- @dsCard group="Thẻ" height=360 -->
<!doctype html>
<html lang="vi">
<head><meta charset="utf-8"><title>ProfileCard — preview</title></head>
<body>
<article class="kt-card kt-profile" style="max-width:400px">
  <div class="kt-sechead"><h2>Hồ sơ</h2><button class="kt-iconbtn kt-iconbtn--sm" aria-label="Sửa hồ sơ"><i data-icon="pencil"></i></button></div>
  <div class="kt-profile__who">
    <span class="kt-avatar kt-avatar--xl kt-avatar--ring a3">TH</span>
    <div><h3>Thanh Hằng</h3><p>Lớp tiếng Nhật N5 · Sáng thứ 7</p></div>
    <span class="kt-chip kt-chip--rank"><i data-icon="star"></i>Hạng 3</span>
  </div>
  <section class="kt-streak" aria-label="Chuỗi ngày học">
  <div class="kt-streak__head"><i data-icon="flame" aria-hidden="true"></i><strong class="kt-num">6</strong><span><b>ngày</b> học liên tiếp</span></div>
  <div class="kt-week"><div class="kt-day is-done"><span class="kt-day__label">CN</span><span class="kt-day__mark"><i data-icon="check"></i></span></div><div class="kt-day is-done"><span class="kt-day__label">T2</span><span class="kt-day__mark"><i data-icon="check"></i></span></div><div class="kt-day is-done"><span class="kt-day__label">T3</span><span class="kt-day__mark"><i data-icon="check"></i></span></div><div class="kt-day is-done"><span class="kt-day__label">T4</span><span class="kt-day__mark"><i data-icon="check"></i></span></div><div class="kt-day is-today" aria-current="date"><span class="kt-day__label">T5</span><span class="kt-day__mark"></span></div><div class="kt-day is-future"><span class="kt-day__label">T6</span><span class="kt-day__mark"></span></div><div class="kt-day is-future"><span class="kt-day__label">T7</span><span class="kt-day__mark"></span></div></div>
</section>
</article>
<script>window.Kotoba && Kotoba.hydrate();</script>
</body>
</html>
