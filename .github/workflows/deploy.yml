name: Đưa Kotoba lên GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Kiểm tra đường dẫn con /japanesestudy/
        run: |
          grep -q '/japanesestudy/assets/' dist/index.html
          grep -q '/japanesestudy/manifest.webmanifest' dist/index.html
          grep -q '/japanesestudy/icons/apple-touch-icon.png' dist/index.html
          test -f dist/manifest.webmanifest
          test -f dist/icons/apple-touch-icon.png
          test -f dist/icons/icon-192.png
          test -f dist/icons/icon-512.png
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
