<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <!-- màu lấy từ token --bg (sáng / tối) trong tokens.css -->
    <meta name="theme-color" content="#f6f5fd" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#12111c" media="(prefers-color-scheme: dark)" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="icon" type="image/png" href="/icons/icon-192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Kotoba" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>Kotoba</title>
    <script>
      // đặt theme trước khi vẽ để không loé nền sáng ở dark mode
      try {
        document.documentElement.dataset.theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
